<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodapé Premium — Portal ESEO</title>
<style>
:root{
  --ink:#FFFFFF;
  --muted:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.30);
  --accent:#0EB7D5;
  --red:#E30613;
  --hover:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  background:transparent!important;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--ink);
}
body{min-height:1px}
.footer-shell{
  width:100%;
  background:transparent!important;
  padding:18px clamp(20px,5vw,72px) 16px;
  border-top:1px solid var(--line);
}
.footer-top{
  display:grid;
  grid-template-columns:minmax(245px,.85fr) minmax(560px,2.15fr);
  gap:30px;
  align-items:center;
  padding-bottom:0;
  border-bottom:0;
}
.brand-block{min-width:0}
.eyebrow{
  margin:0 0 6px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--accent);
}
.brand-title{
  margin:0;
  color:#FFFFFF;
  font-size:clamp(15px,1.4vw,18px);
  line-height:1.25;
  font-weight:800;
  letter-spacing:-.01em;
}
.contact-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px 14px;
}
.contact-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:12.5px;
  font-weight:700;
  text-decoration:none;
}
.contact-link svg{
  width:17px;height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.contact-link:hover,
.contact-link:focus-visible{
  color:#FFFFFF;
  text-decoration:underline;
  text-underline-offset:4px;
  outline:none;
}

.link-zones{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px;
}
.group-title{
  margin:0 0 7px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,.76);
}
.link-list{
  display:grid;
  gap:4px;
}
.quick-link{
  display:grid;
  grid-template-columns:26px 1fr 18px;
  align-items:center;
  gap:8px;
  min-height:36px;
  padding:5px 4px;
  border-radius:10px;
  color:var(--ink);
  text-decoration:none;
  transition:transform .16s ease,color .16s ease,background .16s ease;
}
.quick-link{
  --item-color:var(--accent);
  --item-wash:rgba(14,183,213,.08);
}
.quick-link:hover,
.quick-link:focus-visible{
  background:var(--item-wash);
  color:#FFFFFF;
  transform:translateX(2px);
  outline:1px solid rgba(255,255,255,.18);
  outline-offset:0;
}
.icon-box{
  width:26px;
  height:30px;
  display:grid;
  place-items:center;
  color:#FFFFFF;
  background:none;
  border:0;
  border-radius:0;
  transition:color .16s ease, transform .16s ease;
}
.icon-box svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.quick-link:hover .icon-box,
.quick-link:focus-visible .icon-box{
  color:var(--item-color);
  transform:translateY(-1px) scale(1.10);
  filter:drop-shadow(0 0 5px color-mix(in srgb, var(--item-color) 65%, transparent));
}
.quick-link strong{
  display:block;
  font-size:13px;
  line-height:1.2;
  font-weight:750;
}
.quick-link span.meta{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  line-height:1.25;
}
.quick-link .arrow{
  width:16px;height:16px;
  color:#FFFFFF;
  opacity:.62;
  transition:transform .16s ease,opacity .16s ease;
}
.quick-link:hover .arrow,
.quick-link:focus-visible .arrow{
  transform:translate(2px,-2px);
  opacity:1;
}
.social-link.instagram svg{stroke-width:1.9}
@media(max-width:1000px){
  .footer-top{grid-template-columns:1fr;align-items:start}
  .link-zones{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:660px){
  .footer-shell{padding-inline:18px}
  .link-zones{grid-template-columns:1fr}
    }
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
