name: Fix Portal ESEO internal navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-portal-links.yml"

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate red state and apply surgical fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("Portal-ESEO-Home-ATUAL-Sem-BOT.html")
          canonical_path = Path("Portal_ESEO_Home_app.html")
          text = source_path.read_text(encoding="utf-8")

          # Passo 0: nunca editar uma captura do OneDrive/SharePoint Viewer.
          forbidden = [
              "_spPageContextInfo",
              "OneUp",
              "odsp",
              "SuiteNav",
              "Portal_ESEO_Home_app_files/",
          ]
          hits = [marker for marker in forbidden if marker in text]
          if hits:
              raise SystemExit(f"ABORTADO: arquivo fonte parece captura do OneDrive/SharePoint Viewer: {hits}")

          menu_links = {
              "home": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/OrganizationHome.aspx",
              "conheca": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/Conheca_a_eseo.aspx",
              "oferta": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/Oferta.aspx",
          }

          def is_green(html: str) -> bool:
              menu_ok = all(
                  f'<a data-page="{page}" href="{url}" target="_parent">' in html
                  for page, url in menu_links.items()
              )
              return all([
                  menu_ok,
                  "link.target = '_self'" not in html,
                  "openSharePointSafeLink" not in html,
                  'window.parent.location.href = url;' in html,
                  'window.open(url, "_blank", "noopener");' in html,
                  'function isInternalPortalUrl(url)' in html,
                  'function navigateInternalPortal(url)' in html,
              ])

          # RED: o arquivo atual precisa demonstrar o bug antes da alteração.
          if is_green(text):
              raise SystemExit("ABORTADO: o arquivo já satisfaz todos os critérios; nenhuma alteração foi aplicada.")
          print("RED confirmado: navegação atual ainda não satisfaz os critérios.")

          styles_before = re.findall(r"<style>.*?</style>", text, flags=re.S)

          # 1) Somente os três links do menu superior do Portal ESEO recebem target=_parent.
          for page, url in menu_links.items():
              old = f'<a data-page="{page}" href="{url}">'
              new = f'<a data-page="{page}" href="{url}" target="_parent">'
              if old not in text:
                  raise SystemExit(f"ABORTADO: link esperado não encontrado para {page}.")
              text = text.replace(old, new, 1)

          # 2) Remover a lógica antiga que forçava target=_self nos links do menu.
          force_self_pattern = re.compile(
              r"\n  // Garantir que os links de navegação abram na mesma guia.*?\n  \}\);\n\n(?=  const fallback = \[)",
              flags=re.S,
          )
          text, removed_self = force_self_pattern.subn("\n", text, count=1)
          if removed_self != 1:
              raise SystemExit(f"ABORTADO: bloco target=_self removido {removed_self} vez(es), esperado 1.")

          # 3) Substituir apenas o listener de navegação legado por um único listener de captura.
          new_navigation_script = r'''<script>
          /* Navegação segura dos links internos do Portal ESEO quando incorporado no SharePoint/Teams. */
          (() => {
            function isInternalPortalUrl(url){
              try{
                const target = new URL(url, window.location.href);
                return target.hostname === "sesisenaisp.sharepoint.com" &&
                       target.pathname.toLowerCase().startsWith("/sites/eseoconecta");
              }catch(_){
                return false;
              }
            }

            function navigateInternalPortal(url){
              if(window.parent === window){
                window.location.href = url;
                return;
              }

              try{
                window.parent.location.href = url;
              }catch(_){
                window.open(url, "_blank", "noopener");
              }
            }

            document.addEventListener("click", event => {
              const link = event.target.closest?.("a[href]");
              if(!link || link.hasAttribute("download")) return;
              if(event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

              const href = (link.getAttribute("href") || "").trim();
              if(!href || href.startsWith("#") || /^javascript:/i.test(href)) return;
              if(/^(mailto:|tel:)/i.test(href)) return;
              if(!isInternalPortalUrl(href)) return;

              event.preventDefault();
              const url = new URL(href, window.location.href).href;
              navigateInternalPortal(url);
            }, true);
          })();
          </script>'''

          legacy_navigation_pattern = re.compile(
              r'\n<script>\n/\* Navegação segura quando este HTML está incorporado em um iframe do SharePoint\. \*/.*?</script>\n\n(?=</body>)',
              flags=re.S,
          )
          text, replaced_listener = legacy_navigation_pattern.subn("\n" + new_navigation_script + "\n\n", text, count=1)
          if replaced_listener != 1:
              raise SystemExit(f"ABORTADO: listener legado substituído {replaced_listener} vez(es), esperado 1.")

          # GREEN: validar comportamento exigido e garantir que o CSS permaneceu idêntico.
          if not is_green(text):
              raise SystemExit("FALHA: o HTML corrigido não satisfez todos os critérios de navegação.")

          styles_after = re.findall(r"<style>.*?</style>", text, flags=re.S)
          if styles_before != styles_after:
              raise SystemExit("FALHA: CSS/layout foi alterado, o que não é permitido.")

          if text.count('document.addEventListener("click", event => {') != 1:
              raise SystemExit("FALHA: esperado exatamente um listener de navegação em modo de captura.")

          source_path.write_text(text, encoding="utf-8", newline="\n")
          canonical_path.write_text(text, encoding="utf-8", newline="\n")
          print("GREEN confirmado: navegação corrigida e CSS preservado.")
          PY

      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Portal-ESEO-Home-ATUAL-Sem-BOT.html" "Portal_ESEO_Home_app.html"
          git diff --cached --check
          git commit -m "fix: links internos navegam a página do SharePoint (target _parent)"

      - name: Remove obsolete navigation experiments
        shell: bash
        run: |
          rm -f \
            "Portal_ESEO_Home_app_A_target_top.html" \
            "Portal_ESEO_Home_app_B_target_parent.html" \
            "Portal_ESEO_Home_app_C_window_top_location.html" \
            "Portal_ESEO_Home_app_D_window_parent_location.html" \
            "Portal_ESEO_Home_app_E_window_open_top.html"
          git add -u
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore: remove testes temporários de navegação"
          fi

      - name: Push commits
        shell: bash
        run: git push origin HEAD:main
