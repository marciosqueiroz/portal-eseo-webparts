name: Fix Portal ESEO internal navigation v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-portal-links-v2.yml"

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("Portal-ESEO-Home-ATUAL-Sem-BOT.html")
          canonical_path = Path("Portal_ESEO_Home_app.html")
          text = source_path.read_text(encoding="utf-8")

          forbidden = ["_spPageContextInfo", "OneUp", "odsp", "SuiteNav", "Portal_ESEO_Home_app_files/"]
          hits = [m for m in forbidden if m in text]
          if hits:
              raise SystemExit(f"ABORTADO: arquivo não é o banner real: {hits}")

          menu_links = {
              "home": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/OrganizationHome.aspx",
              "conheca": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/Conheca_a_eseo.aspx",
              "oferta": "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/SitePages/Oferta.aspx",
          }

          def green(html):
              return all(f'<a data-page="{p}" href="{u}" target="_parent">' in html for p,u in menu_links.items()) and \
                     "link.target = '_self'" not in html and \
                     "openSharePointSafeLink" not in html and \
                     'window.parent.location.href = url;' in html and \
                     'window.open(url, "_blank", "noopener");' in html and \
                     'function isInternalPortalUrl(url)' in html and \
                     'function navigateInternalPortal(url)' in html

          if green(text):
              print("Arquivo fonte já está corrigido; apenas sincronizando nome canônico.")
          else:
              print("RED confirmado: comportamento antigo presente.")
              styles_before = re.findall(r"<style>.*?</style>", text, flags=re.S)

              for page,url in menu_links.items():
                  old = f'<a data-page="{page}" href="{url}">'
                  new = f'<a data-page="{page}" href="{url}" target="_parent">'
                  if old not in text:
                      raise SystemExit(f"Link esperado não encontrado: {page}")
                  text = text.replace(old,new,1)

              force_self = re.compile(r"\n  // Garantir que os links de navegação abram na mesma guia.*?\n  \}\);\n\n(?=  const fallback = \[)", re.S)
              text,n = force_self.subn("\n",text,count=1)
              if n != 1:
                  raise SystemExit(f"Bloco _self removido {n} vezes; esperado 1")

              navigation = r'''<script>
/* Navegação segura dos links internos do Portal ESEO quando incorporado no SharePoint/Teams. */
(() => {
  function isInternalPortalUrl(url){
    try{
      const target = new URL(url, window.location.href);
      return target.hostname === "sesisenaisp.sharepoint.com" &&
             target.pathname.toLowerCase().startsWith("/sites/eseoconecta");
    }catch(_){
      return false;
    }
  }

  function navigateInternalPortal(url){
    if(window.parent === window){
      window.location.href = url;
      return;
    }
    try{
      window.parent.location.href = url;
    }catch(_){
      window.open(url, "_blank", "noopener");
    }
  }

  document.addEventListener("click", event => {
    const link = event.target.closest?.("a[href]");
    if(!link || link.hasAttribute("download")) return;
    if(event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

    const href = (link.getAttribute("href") || "").trim();
    if(!href || href.startsWith("#") || /^javascript:/i.test(href)) return;
    if(/^(mailto:|tel:)/i.test(href)) return;
    if(!isInternalPortalUrl(href)) return;

    event.preventDefault();
    const url = new URL(href, window.location.href).href;
    navigateInternalPortal(url);
  }, true);
})();
</script>'''

              legacy = re.compile(r'\n<script>\n/\* Navegação segura quando este HTML está incorporado em um iframe do SharePoint\. \*/.*?</script>\n\n(?=</body>)', re.S)
              text,n = legacy.subn("\n"+navigation+"\n\n",text,count=1)
              if n != 1:
                  raise SystemExit(f"Listener legado substituído {n} vezes; esperado 1")

              if re.findall(r"<style>.*?</style>",text,re.S) != styles_before:
                  raise SystemExit("CSS/layout foi alterado")

          if not green(text):
              raise SystemExit("GREEN falhou: critérios de navegação não satisfeitos")

          text = text.rstrip("\n") + "\n"
          source_path.write_text(text,encoding="utf-8",newline="\n")
          canonical_path.write_text(text,encoding="utf-8",newline="\n")
          print("GREEN confirmado: navegação correta e CSS preservado.")
          PY

      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Portal-ESEO-Home-ATUAL-Sem-BOT.html" "Portal_ESEO_Home_app.html"
          git diff --cached --check
          git commit -m "fix: links internos navegam a página do SharePoint (target _parent)"

      - name: Remove test variants
        shell: bash
        run: |
          rm -f \
            "Portal_ESEO_Home_app_A_target_top.html" \
            "Portal_ESEO_Home_app_B_target_parent.html" \
            "Portal_ESEO_Home_app_C_window_top_location.html" \
            "Portal_ESEO_Home_app_D_window_parent_location.html" \
            "Portal_ESEO_Home_app_E_window_open_top.html"
          git add -u
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore: remove testes temporários de navegação"
          fi

      - name: Push
        run: git push origin HEAD:main
