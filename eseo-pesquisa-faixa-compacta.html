<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa de satisfação — Portal ESEO</title>

  <style>
    :root {
      --navy: #071a25;
      --navy-soft: #10384a;
      --cyan: #16c2df;
      --red: #e30613;
      --white: #fff;
      --muted: rgba(255,255,255,.76);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 180px;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body { padding: 4px; }

    .strip {
      position: relative;
      width: min(100%, 1480px);
      height: 172px;
      display: grid;
      grid-template-columns: minmax(290px, .8fr) minmax(360px, 1.2fr);
      align-items: center;
      gap: clamp(24px, 5vw, 72px);
      margin: 0 auto;
      padding: 24px clamp(26px, 4vw, 58px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      color: var(--white);
      background:
        radial-gradient(circle at 82% 18%, rgba(22,194,223,.18), transparent 33%),
        linear-gradient(115deg, var(--navy) 0%, var(--navy-soft) 100%);
      box-shadow: 0 12px 30px rgba(7,26,37,.16);
    }

    .strip::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      content: "";
      background: linear-gradient(90deg, var(--cyan), rgba(255,255,255,.62) 68%, var(--red));
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 3vw, 40px);
      font-weight: 720;
      letter-spacing: -.035em;
      line-height: 1.04;
    }

    .support {
      min-width: 0;
      padding-left: clamp(22px, 3vw, 48px);
      border-left: 1px solid rgba(22,194,223,.45);
    }

    .support p {
      max-width: 700px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.35vw, 17px);
      line-height: 1.45;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .meta span {
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      color: rgba(255,255,255,.72);
      background: rgba(255,255,255,.06);
      font-size: 11px;
      font-weight: 650;
    }

    @media (max-width: 680px) {
      .strip {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 18px 22px;
      }

      .eyebrow { margin-bottom: 4px; }
      h1 { font-size: clamp(24px, 7.2vw, 31px); }

      .support {
        padding: 9px 0 0;
        border-top: 1px solid rgba(22,194,223,.35);
        border-left: 0;
      }

      .support p { font-size: 13px; line-height: 1.35; }
      .meta { margin-top: 7px; }
      .meta span { padding: 3px 7px; font-size: 10px; }
    }
  </style>
</head>

<body>
  <main class="strip" aria-labelledby="surveyTitle">
    <div>
      <p class="eyebrow">Pesquisa de satisfação</p>
      <h1 id="surveyTitle">Ajude a melhorar o Portal ESEO</h1>
    </div>

    <div class="support">
      <p>Sua experiência orienta as próximas melhorias do portal. A resposta é rápida e faz diferença.</p>
      <div class="meta" aria-label="Informações sobre a pesquisa">
        <span>2 perguntas</span>
        <span>Menos de 1 minuto</span>
      </div>
    </div>
  </main>
</body>
</html>
