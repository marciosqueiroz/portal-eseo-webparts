<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposta Pedagógica Interativa - ESEO</title>
  <style>
    :root {
      --navy: #8a111b;
      --navy-soft: #a82029;
      --cyan: #f01820;
      --red: #e30613;
      --ink: #39282a;
      --muted: #766164;
      --line: rgba(138, 17, 27, .17);
      --surface: rgba(255, 255, 255, .82);
      --surface-strong: rgba(255, 255, 255, .96);
      --shadow: 0 18px 48px rgba(92, 16, 22, .09);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button,
    a { font: inherit; }

    .app {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 270px;
      padding: clamp(38px, 5vw, 64px) clamp(34px, 6vw, 84px) 72px;
      border: 1px solid rgba(138,17,27,.16);
      border-radius: 20px 20px 0 0;
      background:
        linear-gradient(#f01820 0 0) 28px 38px / 17px 88px no-repeat,
        linear-gradient(#87000d 0 0) 41px 66px / 25px 96px no-repeat,
        linear-gradient(90deg, #87000d 0 55%, #f01820 55% 100%) 0 100% / 44% 18px no-repeat,
        #fff;
      color: var(--ink);
    }

    .hero::before {
      position: absolute;
      right: 6%;
      bottom: 0;
      width: 13%;
      height: 7px;
      content: "";
      background: var(--red);
    }

    .hero::after {
      position: absolute;
      right: 2.5%;
      bottom: 18px;
      width: 30px;
      height: 98px;
      content: "";
      background: var(--red);
    }

    .eyebrow {
      max-width: 850px;
      margin: 0 0 13px auto;
      color: var(--red);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-align: right;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 850px;
      margin: 0 0 0 auto;
      color: #8b2d31;
      font-size: clamp(34px, 5vw, 64px);
      font-weight: 500;
      line-height: 1.03;
      letter-spacing: -.045em;
      text-align: right;
    }

    .hero p:last-child {
      max-width: 720px;
      margin: 18px 0 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
      text-align: right;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(265px, .72fr) minmax(0, 1.75fr);
      min-height: 610px;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 20px 20px;
      background: rgba(252,249,249,.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .sidebar {
      padding: 26px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.38);
    }

    .sidebar-title {
      margin: 0 10px 14px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .chapter-list {
      display: grid;
      gap: 7px;
    }

    .chapter-button {
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }

    .chapter-button:hover,
    .chapter-button:focus-visible {
      border-color: var(--line);
      background: rgba(255,255,255,.78);
      outline: none;
    }

    .chapter-button.active {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .chapter-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 900;
      opacity: .78;
    }

    .chapter-label strong {
      display: block;
      font-size: 13px;
      line-height: 1.28;
    }

    .chapter-label small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .chapter-button.active small { color: rgba(255,255,255,.64); }

    .reader {
      min-width: 0;
      padding: clamp(28px, 4vw, 56px);
      background: var(--surface);
    }

    .reader-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .reader-kicker {
      margin: 0 0 9px;
      color: var(--red);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .reader h2 {
      max-width: 820px;
      margin: 0;
      color: var(--navy);
      font-size: clamp(27px, 3.2vw, 43px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .page-badge {
      flex: 0 0 auto;
      min-width: 88px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.72);
      text-align: center;
    }

    .page-badge span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .page-badge strong {
      display: block;
      margin-top: 3px;
      color: var(--navy);
      font-size: 18px;
    }

    .summary {
      max-width: 920px;
      margin: 24px 0 0;
      color: #526873;
      font-size: 16px;
      line-height: 1.65;
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 30px;
    }

    .topic {
      min-height: 76px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.62);
    }

    .topic::before {
      width: 20px;
      height: 3px;
      display: block;
      margin-bottom: 10px;
      background: var(--cyan);
      content: "";
    }

    .topic strong {
      color: var(--navy);
      font-size: 13px;
      line-height: 1.35;
    }

    .reader-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .progress {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 6px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .action:hover,
    .action:focus-visible {
      background: var(--navy);
      color: #fff;
      outline: none;
    }

    .action.primary {
      background: var(--navy);
      color: #fff;
    }

    .action.primary:hover { background: var(--navy-soft); }

    .action:disabled {
      border-color: rgba(138,17,27,.20);
      background: transparent;
      color: rgba(57,40,42,.38);
      cursor: not-allowed;
    }

    .secondary-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin: 12px 2px 0;
    }

    .secondary-links a {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .secondary-links a:hover { color: var(--navy); text-decoration: underline; }

    @media (max-width: 880px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .chapter-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .chapter-button {
        min-height: 78px;
        grid-template-columns: 30px 1fr;
        padding: 8px;
      }
      .chapter-number { width: 28px; height: 28px; }
    }

    @media (max-width: 620px) {
      .app { padding: 0; }
      .hero,
      .workspace { border-radius: 0; }
      .hero {
        min-height: 245px;
        padding: 38px 28px 64px 74px;
      }
      .hero::after { right: 14px; width: 20px; height: 70px; }
      .chapter-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .reader-top { display: block; }
      .page-badge {
        width: max-content;
        margin-top: 16px;
        text-align: left;
      }
      .topics { grid-template-columns: 1fr; }
      .reader-footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Documento institucional - CFP 1.50</p>
      <h1>Proposta Pedagógica ESEO</h1>
      <p>Explore os principais eixos do documento e acesse diretamente o trecho oficial correspondente.</p>
    </header>

    <section class="workspace" aria-label="Leitura interativa da proposta pedagógica">
      <aside class="sidebar">
        <p class="sidebar-title">Índice interativo</p>
        <nav class="chapter-list" id="chapterList" aria-label="Capítulos da proposta"></nav>
      </aside>

      <article class="reader" aria-live="polite">
        <div class="reader-top">
          <div>
            <p class="reader-kicker" id="readerKicker"></p>
            <h2 id="readerTitle"></h2>
          </div>
          <div class="page-badge">
            <span>Páginas</span>
            <strong id="readerPages"></strong>
          </div>
        </div>

        <p class="summary" id="readerSummary"></p>
        <div class="topics" id="readerTopics"></div>

        <footer class="reader-footer">
          <span class="progress" id="readerProgress"></span>
          <div class="actions">
            <button class="action" id="previousChapter" type="button">Anterior</button>
            <button class="action" id="nextChapter" type="button">Próximo</button>
            <a class="action primary" id="openOfficial" target="_blank" rel="noopener noreferrer">
              Abrir trecho oficial
            </a>
          </div>
        </footer>
      </article>
    </section>

    <div class="secondary-links">
      <a id="openReferences" target="_blank" rel="noopener noreferrer">Referências - página 67</a>
      <a id="openCredits" target="_blank" rel="noopener noreferrer">Créditos - página 70</a>
    </div>
  </main>

  <script>
    const PDF_URL = "https://sesisenaisp.sharepoint.com/sites/ESEOConecta/Documentos%20Compartilhados/Documentos%20da%20p%C3%A1gina%20ESEO/Proposta%20pedag%C3%B3gica%201.50.pdf?web=1";

    const CHAPTERS = [
      {
        title: "Introdução",
        short: "Introdução",
        pages: "4-5",
        page: 4,
        summary: "Apresenta a função estratégica da Proposta Pedagógica, seu caráter institucional e o compromisso da ESEO com uma educação profissional de qualidade, alinhada às necessidades dos alunos, da indústria e da comunidade.",
        topics: [
          "Identidade e compromisso educacional",
          "Diretrizes para o trabalho da escola",
          "Construção coletiva e atualização contínua",
          "Alinhamento às orientações educacionais"
        ]
      },
      {
        title: "Contexto histórico e razão da criação da escola",
        short: "História e identidade",
        pages: "6-18",
        page: 6,
        summary: "Reúne a identificação institucional da ESEO, seus fundamentos, missão, visão e valores, além da trajetória da educação a distância no SENAI-SP e das razões que sustentaram a criação da escola.",
        topics: [
          "Identificação da Escola SENAI de Educação Online",
          "Missão, visão e valores",
          "Evolução histórica da educação a distância",
          "Justificativa para implantação da ESEO"
        ]
      },
      {
        title: "Demanda por tipo de atendimento",
        short: "Tipos de atendimento",
        pages: "19-40",
        page: 19,
        summary: "Organiza as diferentes formas de atuação da ESEO e apresenta as características dos atendimentos educacionais, dos cursos de formação inicial às ofertas técnicas, superiores e de pós-graduação.",
        topics: [
          "Formação inicial e continuada",
          "Aprendizagem profissional EaD e híbrida",
          "Cursos técnicos e atendimento nacional",
          "Graduação e especialização profissional"
        ]
      },
      {
        title: "Metodologia norteadora dos processos da ESEO",
        short: "Metodologia",
        pages: "41-49",
        page: 41,
        summary: "Sintetiza os princípios metodológicos que orientam os processos educacionais da escola, considerando as particularidades da modalidade a distância, as formas de avaliação e o compromisso com a acessibilidade.",
        topics: [
          "Especificidades metodológicas da EaD",
          "Mediação e experiências de aprendizagem",
          "Avaliação e recuperação da aprendizagem",
          "Acessibilidade nos cursos a distância"
        ]
      },
      {
        title: "Recursos institucionais, humanos, tecnológicos e físicos",
        short: "Recursos da escola",
        pages: "50-63",
        page: 50,
        summary: "Apresenta a estrutura que sustenta o funcionamento da ESEO, incluindo equipes, atribuições, recursos tecnológicos, infraestrutura física e ambientes utilizados pela unidade.",
        topics: [
          "Recursos humanos e organização das equipes",
          "Cargos técnicos, pedagógicos e de gestão",
          "Infraestrutura física da unidade",
          "Ambientes e recursos tecnológicos"
        ]
      },
      {
        title: "Legislação, normas, políticas e diretrizes",
        short: "Base normativa",
        pages: "64-66",
        page: 64,
        summary: "Consolida o conjunto de referências legais e institucionais que orienta a atuação da escola e assegura coerência entre as ofertas educacionais, as políticas do SENAI e a regulamentação vigente.",
        topics: [
          "Legislação educacional aplicável",
          "Normas e resoluções institucionais",
          "Políticas e diretrizes públicas",
          "Referenciais para conformidade educacional"
        ]
      }
    ];

    const elements = {
      list: document.getElementById("chapterList"),
      kicker: document.getElementById("readerKicker"),
      title: document.getElementById("readerTitle"),
      pages: document.getElementById("readerPages"),
      summary: document.getElementById("readerSummary"),
      topics: document.getElementById("readerTopics"),
      progress: document.getElementById("readerProgress"),
      previous: document.getElementById("previousChapter"),
      next: document.getElementById("nextChapter"),
      official: document.getElementById("openOfficial"),
      references: document.getElementById("openReferences"),
      credits: document.getElementById("openCredits")
    };

    let activeChapter = 0;

    function pdfPage(page) {
      return `${PDF_URL}#page=${page}`;
    }

    function renderIndex() {
      elements.list.innerHTML = CHAPTERS.map((chapter, index) => `
        <button
          class="chapter-button${index === activeChapter ? " active" : ""}"
          type="button"
          data-chapter="${index}"
          aria-pressed="${index === activeChapter}"
        >
          <span class="chapter-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="chapter-label">
            <strong>${chapter.short}</strong>
            <small>Páginas ${chapter.pages}</small>
          </span>
        </button>
      `).join("");

      elements.list.querySelectorAll("[data-chapter]").forEach(button => {
        button.addEventListener("click", () => selectChapter(Number(button.dataset.chapter)));
      });
    }

    function renderReader() {
      const chapter = CHAPTERS[activeChapter];
      elements.kicker.textContent = `Capítulo ${String(activeChapter + 1).padStart(2, "0")}`;
      elements.title.textContent = chapter.title;
      elements.pages.textContent = chapter.pages;
      elements.summary.textContent = chapter.summary;
      elements.topics.innerHTML = chapter.topics
        .map(topic => `<div class="topic"><strong>${topic}</strong></div>`)
        .join("");
      elements.progress.textContent = `${activeChapter + 1} de ${CHAPTERS.length} capítulos`;
      elements.official.href = pdfPage(chapter.page);
      elements.previous.disabled = activeChapter === 0;
      elements.next.disabled = activeChapter === CHAPTERS.length - 1;
    }

    function selectChapter(index) {
      activeChapter = Math.max(0, Math.min(index, CHAPTERS.length - 1));
      renderIndex();
      renderReader();
    }

    elements.previous.addEventListener("click", () => selectChapter(activeChapter - 1));
    elements.next.addEventListener("click", () => selectChapter(activeChapter + 1));
    elements.references.href = pdfPage(67);
    elements.credits.href = pdfPage(70);

    selectChapter(0);
  </script>
</body>
</html>
