<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESEO — Nossa Jornada</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#f7f8fc;
}

/* ════════════════════════════════════════
   LAYOUT PRINCIPAL — split left/right
════════════════════════════════════════ */
.wrap{
  width:100%;height:100%;
  display:flex;
}

/* ════ PAINEL ESQUERDO ════ */
.left{
  flex:0 0 38%;
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:background 1s ease;
  background:#1a4f8a;
}

/* Canvas de formas geométricas no painel esq */
#geoCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;opacity:.18;
}

/* Logo topo */
.left-logo{
  position:relative;z-index:2;
  padding:22px 28px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.logo-box{
  width:32px;height:32px;background:#E30613;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;
  font-family:'Arial Black',Arial,sans-serif;
  flex-shrink:0;
}
.logo-text{
  font-size:11px;font-weight:800;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,.5);
}

/* Conteúdo central esquerdo */
.left-center{
  flex:1;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;
  padding:0 36px 0 36px;
  position:relative;z-index:2;
}

/* ERA badge */
.left-era{
  font-size:11px;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.5);
  margin-bottom:14px;
  transition:color .8s;
}

/* ANO — elemento hero */
.left-year{
  font-size:clamp(72px,10vw,130px);
  font-weight:900;
  font-family:'Arial Black',Arial,sans-serif;
  color:#fff;
  line-height:.92;
  letter-spacing:-5px;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}
/* clip-reveal do ano */
.left-year span{
  display:block;
  transform:translateY(110%);
  transition:transform .7s cubic-bezier(.22,1,.36,1);
}
.left-year.visible span{transform:translateY(0)}

/* Barra decorativa */
.left-bar{
  width:48px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.35);
  transition:background 1s;
}

/* Número do total */
.left-count{
  margin-top:auto;
  padding-bottom:28px;
  font-size:11px;color:rgba(255,255,255,.28);
  font-weight:600;letter-spacing:1px;
}

/* ════ DOTS DE PROGRESSO — dentro do painel esquerdo, canto direito ════ */
.dots-bar{
  position:absolute;right:14px;top:0;bottom:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;
  z-index:10;
  padding:80px 0;
}
.vdot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.25);
  cursor:pointer;
  transition:all .35s;
  flex-shrink:0;
}
.vdot.past{background:rgba(255,255,255,.55)}
.vdot.active{
  width:4px;height:22px;
  border-radius:3px;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.5);
}

/* ════ PAINEL DIREITO ════ */
.right{
  flex:1;
  position:relative;
  display:flex;flex-direction:column;
  background:#f7f8fc;
  overflow:hidden;
}

/* Textura geométrica suave no fundo direito */
.right::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(rgba(26,79,138,.04) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}

/* Topo direito — intro + progresso */
.right-top{
  flex-shrink:0;
  padding:22px 48px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.intro-label{
  display:flex;flex-direction:column;gap:3px;
}
.intro-main{
  font-size:14px;font-weight:700;color:#111827;letter-spacing:.2px;
}
.intro-sub{
  font-size:12px;color:#9ca3af;
}
.right-ctr{
  font-size:13px;font-weight:700;color:#d1d5db;
  font-family:'Arial Black',Arial,sans-serif;
  letter-spacing:.5px;
}

/* Barra de progresso */
.prog-wrap{
  flex-shrink:0;
  margin:14px 48px 0;
  height:2px;background:#e5e7eb;border-radius:2px;overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:2px;
  transition:width .8s ease,background .8s ease;
}

/* Conteúdo central direito */
.right-center{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;
  padding:0 80px 60px 56px;
  position:relative;
}

/* Slide */
.rslide{
  position:absolute;
  inset:0;
  padding:0 80px 60px 56px;
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;
}
.rslide.active{opacity:1;pointer-events:auto}

/* Animações direita */
.rslide.enter-up   .ri{animation:riEnterUp   .72s cubic-bezier(.22,1,.36,1) forwards}
.rslide.enter-down .ri{animation:riEnterDown .72s cubic-bezier(.22,1,.36,1) forwards}
.rslide.exit-up    .ri{animation:riExitUp    .48s ease forwards}
.rslide.exit-down  .ri{animation:riExitDown  .48s ease forwards}
@keyframes riEnterUp  {from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)}}
@keyframes riEnterDown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
@keyframes riExitUp   {from{opacity:1;transform:translateY(0)}     to{opacity:0;transform:translateY(-32px)}}
@keyframes riExitDown {from{opacity:1;transform:translateY(0)}     to{opacity:0;transform:translateY(32px)}}
.ri{opacity:0}

/* Linha acento */
.r-accent{
  width:40px;height:3px;border-radius:2px;
  margin-bottom:28px;
  transition:background .8s;
}

/* Título */
.r-title{
  font-size:clamp(26px,3.2vw,44px);
  font-weight:800;color:#111827;
  line-height:1.2;letter-spacing:-.5px;
  margin-bottom:22px;
}

/* Divisor */
.r-div{
  width:1px;height:36px;
  margin-bottom:22px;
  transition:background .8s;
}

/* Descrição */
.r-desc{
  font-size:clamp(15px,1.6vw,20px);
  color:#6b7280;line-height:1.85;
  max-width:520px;
}

/* ════ NAVEGAÇÃO SETAS — no painel esquerdo, sempre visíveis ════ */
.nav{
  position:relative;z-index:5;
  flex-shrink:0;
  display:flex;gap:10px;align-items:center;
  padding:0 28px 28px;
}
.nbtn{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.8);
  cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  backdrop-filter:blur(8px);
}
.nbtn:hover:not(:disabled){
  background:rgba(255,255,255,.25);
  border-color:rgba(255,255,255,.7);
  color:#fff;
  transform:scale(1.08);
}
.nbtn:disabled{opacity:.2;cursor:default;transform:none!important}

/* Hint scroll */
.scroll-hint{
  position:absolute;bottom:34px;left:56px;
  font-size:11px;color:#d1d5db;
  letter-spacing:1px;
  display:flex;gap:6px;align-items:center;
}
.sk{border:1px solid #e5e7eb;border-radius:4px;padding:2px 7px;font-size:10px;color:#d1d5db}
</style>
</head>
<body>
<div class="wrap">

  <!-- ════ ESQUERDO ════ -->
  <div class="left" id="leftPanel">
    <canvas id="geoCanvas"></canvas>

    <div class="left-logo">
      <div class="logo-box">S</div>

    </div>

    <div class="left-center">
      <div class="left-era" id="leftEra">Era Pioneira</div>
      <div class="left-year" id="leftYear"><span id="yearTxt">1979</span></div>
      <div class="left-bar" id="leftBar"></div>
    </div>

    <!-- Navegação — dentro do painel esquerdo, sempre legível -->
    <div class="nav">
      <button class="nbtn" id="btnP">↑</button>
      <button class="nbtn" id="btnN">↓</button>
    </div>

    <div class="left-count" id="leftCount">01 / 11</div>

    <!-- Dots verticais na borda direita -->
    <div class="dots-bar" id="dotsBar"></div>
  </div>

  <!-- ════ DIREITO ════ -->
  <div class="right">

    <div class="right-top">
      <div class="intro-label">
        <div class="intro-main">Nossa Jornada na Educação a Distância</div>
        <div class="intro-sub">SENAI-SP · Navegue pelos marcos históricos</div>
      </div>
      <div class="right-ctr" id="rightCtr">01<span style="color:#e5e7eb;font-weight:400"> / </span>11</div>
    </div>

    <div class="prog-wrap">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>

    <!-- Slides direito -->
    <div style="position:relative;flex:1" id="rslides"></div>

    <div class="scroll-hint">
      <span class="sk">↑</span><span class="sk">↓</span>
      <span>ou scroll</span>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════
   DADOS
═══════════════════════ */
const EV = [
  {year:'1979',    era:'Era Pioneira',   ec:'#1a4f8a',
   title:'O Primeiro Marco',
   desc:'Leitura e Interpretação de Desenho Técnico-Mecânico com módulos impressos e televisores. O ponto de partida de toda a jornada EaD do SENAI-SP.'},
  {year:'1990',    era:'Era Pioneira',   ec:'#1a4f8a',
   title:'Modelo Híbrido',
   desc:'Consolidação do catálogo com materiais impressos e videoaulas, ampliando o alcance da educação profissional para além das escolas físicas.'},
  {year:'1995',    era:'Era Pioneira',   ec:'#1a4f8a',
   title:'Telecurso 2000',
   desc:'SENAI-SP participa do Telecurso 2000 Profissionalizante em Mecânica — educação a distância com alcance nacional e impacto transformador.'},
  {year:'2007',    era:'Era Pioneira',   ec:'#1a4f8a',
   title:'Nasce o Centro de EaD',
   desc:'Criação do grupo que originou o Centro SENAI de Educação a Distância — o início formal da transição para a era digital.'},
  {year:'2010',    era:'Era Digital',    ec:'#6d28d9',
   title:'Pioneirismo no Superior',
   desc:'Tecnologia de Produção Gráfica oferta unidades curriculares a distância — o primeiro modelo híbrido na graduação SENAI-SP.'},
  {year:'2010–17', era:'Era Digital',    ec:'#6d28d9',
   title:'A Era da Escala',
   desc:'O SENAI-SP alcança 1,5 milhão de alunos em cursos a distância. A cultura digital consolida-se definitivamente em todo o estado.'},
  {year:'2017',    era:'Era Digital',    ec:'#6d28d9',
   title:'Técnico Semipresencial',
   desc:'Primeiro curso técnico semipresencial implantado em Santos, expandindo para 7 cursos e 19 turmas em São Paulo.'},
  {year:'2019',    era:'Era Digital',    ec:'#6d28d9',
   title:'Chegada à Pós-graduação',
   desc:'Especialização em Inovação e Competitividade Industrial — o EaD chega ao ensino de pós-graduação do SENAI-SP.'},
  {year:'2020',    era:'Era ESEO',       ec:'#059669',
   title:'Aceleração Digital',
   desc:'Mais de 800 mil matrículas online. O SENAI-SP lidera a resposta educacional à pandemia — e prova a força do EaD em escala nacional.'},
  {year:'2022',    era:'Era ESEO',       ec:'#E30613',
   title:'Nasce a ESEO',
   desc:'Escola SENAI de Educação Online — o nome oficial que consolida décadas de inovação e posiciona o SENAI-SP como referência nacional em EaD.'},
  {year:'2025',    era:'Era ESEO',       ec:'#E30613',
   title:'Novo Marco Regulatório',
   desc:'Decreto nº 12.456/2025 redefine padrões de qualidade, presencialidade e infraestrutura. A ESEO está preparada para o futuro.'},
];

const N = EV.length;
let cur = 0, animating = false;

/* ═══════════════════════
   GEO CANVAS (painel esq)
═══════════════════════ */
const gc = document.getElementById('geoCanvas');
const gx = gc.getContext('2d');
function resizeGeo(){gc.width=gc.offsetWidth;gc.height=gc.offsetHeight}
resizeGeo();
window.addEventListener('resize',resizeGeo);

const gshapes=[];
for(let i=0;i<18;i++){
  gshapes.push({
    type:['tri','dia','chev','rect'][i%4],
    x:Math.random()*100,y:Math.random()*100,
    sz:16+Math.random()*48,
    a:Math.random()*Math.PI*2,
    rs:(Math.random()-.5)*.007,
    dx:(Math.random()-.5)*.012,
    dy:(Math.random()-.5)*.01,
  });
}
function drawGeo(){
  gx.clearRect(0,0,gc.width,gc.height);
  gshapes.forEach(s=>{
    const x=s.x/100*gc.width,y=s.y/100*gc.height;
    gx.save();gx.translate(x,y);gx.rotate(s.a);
    gx.strokeStyle='#fff';gx.lineWidth=1.2;gx.globalAlpha=1;
    const z=s.sz;
    if(s.type==='tri'){gx.beginPath();gx.moveTo(0,-z);gx.lineTo(z*.87,z*.5);gx.lineTo(-z*.87,z*.5);gx.closePath();gx.stroke();}
    else if(s.type==='dia'){gx.beginPath();gx.moveTo(0,-z);gx.lineTo(z*.6,0);gx.lineTo(0,z);gx.lineTo(-z*.6,0);gx.closePath();gx.stroke();}
    else if(s.type==='chev'){gx.beginPath();gx.moveTo(-z*.5,-z*.35);gx.lineTo(0,z*.35);gx.lineTo(z*.5,-z*.35);gx.lineWidth=1.8;gx.stroke();}
    else{gx.strokeRect(-z*.4,-z*.28,z*.8,z*.56);}
    gx.restore();
    s.x+=s.dx;s.y+=s.dy;s.a+=s.rs;
    if(s.x<-5)s.x=105;if(s.x>105)s.x=-5;
    if(s.y<-5)s.y=105;if(s.y>105)s.y=-5;
  });
  requestAnimationFrame(drawGeo);
}
drawGeo();

/* ═══════════════════════
   BUILD SLIDES DIREITO
═══════════════════════ */
const rslidesEl=document.getElementById('rslides');
EV.forEach((ev,i)=>{
  const sl=document.createElement('div');
  sl.className='rslide'+(i===0?' active':'');
  sl.dataset.i=i;
  sl.innerHTML=`<div class="ri">
    <div class="r-accent" style="background:${ev.ec}"></div>
    <div class="r-title">${ev.title}</div>
    <div class="r-div" style="background:linear-gradient(180deg,${ev.ec},transparent)"></div>
    <div class="r-desc">${ev.desc}</div>
  </div>`;
  rslidesEl.appendChild(sl);
});
// Animate first
document.querySelector('.rslide.active .ri').style.animation='riEnterUp .72s cubic-bezier(.22,1,.36,1) forwards';

/* ═══════════════════════
   BUILD DOTS
═══════════════════════ */
const dotsBar=document.getElementById('dotsBar');
EV.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='vdot'+(i===0?' active':'');
  d.addEventListener('click',()=>goTo(i));
  dotsBar.appendChild(d);
});
const dotEls=[...dotsBar.children];

/* ═══════════════════════
   NAVIGATE
═══════════════════════ */
function goTo(next){
  if(animating||next===cur||next<0||next>=N)return;
  animating=true;
  const going=next>cur;

  // Animate left year out
  const yearEl=document.getElementById('leftYear');
  yearEl.classList.remove('visible');

  // Animate right slide out
  const prevRsl=document.querySelector('.rslide.active');
  const prevRi=prevRsl.querySelector('.ri');
  prevRi.style.animation='none';void prevRi.offsetWidth;
  prevRi.style.animation=going?'riExitUp .45s ease forwards':'riExitDown .45s ease forwards';

  setTimeout(()=>{
    prevRsl.classList.remove('active');
    cur=next;
    updateLeft();

    // Animate right slide in
    const nextRsl=document.querySelector(`.rslide[data-i="${cur}"]`);
    const nextRi=nextRsl.querySelector('.ri');
    nextRsl.classList.add('active');
    nextRi.style.animation='none';void nextRi.offsetWidth;
    nextRi.style.animation=going?'riEnterUp .72s cubic-bezier(.22,1,.36,1) forwards':'riEnterDown .72s cubic-bezier(.22,1,.36,1) forwards';

    // Animate year in (after short delay for drama)
    setTimeout(()=>{
      yearEl.classList.add('visible');
    },80);

    updateDots();
    updateProgress();
    setTimeout(()=>animating=false,750);
  },420);
}

function updateLeft(){
  const ev=EV[cur];
  document.getElementById('leftPanel').style.background=ev.ec;
  document.getElementById('leftEra').textContent=ev.era;
  document.getElementById('yearTxt').textContent=ev.year;
  document.getElementById('leftBar').style.background='rgba(255,255,255,.35)';
  document.getElementById('leftCount').textContent=
    String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
}

function updateDots(){
  dotEls.forEach((d,i)=>{
    d.classList.toggle('active',i===cur);
    d.classList.toggle('past',i<cur);
  });
}

function updateProgress(){
  const pct=N<=1?100:(cur/(N-1))*100;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progFill').style.background=EV[cur].ec;
  document.getElementById('rightCtr').innerHTML=
    String(cur+1).padStart(2,'0')+'<span style="color:#e5e7eb;font-weight:400"> / </span>'+String(N).padStart(2,'0');
  document.getElementById('btnP').disabled=cur===0;
  document.getElementById('btnN').disabled=cur===N-1;
}

/* ═══════════════════════
   INIT
═══════════════════════ */
setTimeout(()=>{
  document.getElementById('leftYear').classList.add('visible');
},200);
updateLeft();
updateDots();
updateProgress();

/* ═══════════════════════
   EVENTS
═══════════════════════ */
document.getElementById('btnP').addEventListener('click',()=>goTo(cur-1));
document.getElementById('btnN').addEventListener('click',()=>goTo(cur+1));

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();goTo(cur-1)}
  if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();goTo(cur+1)}
  if(e.key==='Home'){e.preventDefault();goTo(0)}
  if(e.key==='End'){e.preventDefault();goTo(N-1)}
});

let scrollTimer,ty=0;
window.addEventListener('wheel',e=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    if(e.deltaY>25)goTo(cur+1);
    else if(e.deltaY<-25)goTo(cur-1);
  },30);
},{passive:true});

document.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=ty-e.changedTouches[0].clientY;
  if(Math.abs(dy)>50){if(dy>0)goTo(cur+1);else goTo(cur-1);}
},{passive:true});
</script>
</body>
</html>
