<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESEO — Nossa Jornada</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#f7f8fc;
}
.wrap{width:100%;height:100%;display:flex}

/* ══ PAINEL ESQUERDO ══ */
.left{
  flex:0 0 38%;position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:background .9s ease;
  background:#1a4f8a;
}
#geoCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.18}

.left-logo{
  position:relative;z-index:2;
  padding:16px 22px;flex-shrink:0;
}
.logo-img{height:38px;width:auto;display:block}

.left-center{
  flex:1;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;
  padding:0 30px;position:relative;z-index:2;
}
.left-era{
  font-size:10px;font-weight:800;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,.55);
  margin-bottom:10px;
}
/* Ano — nunca quebra linha */
.left-year{
  font-size:clamp(52px,8vw,110px);
  font-weight:900;font-family:'Arial Black',Arial,sans-serif;
  color:#fff;line-height:.92;letter-spacing:-4px;
  margin-bottom:16px;
  overflow:hidden;
  white-space:nowrap;
}
.left-year span{
  display:block;
  transform:translateY(110%);
  transition:transform .7s cubic-bezier(.22,1,.36,1);
}
.left-year.visible span{transform:translateY(0)}
.left-bar{width:40px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}

/* Setas no painel esquerdo */
.nav{
  position:relative;z-index:5;flex-shrink:0;
  display:flex;gap:8px;align-items:center;
  padding:16px 22px;
}
.nbtn{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.85);
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.nbtn:hover:not(:disabled){background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.7);color:#fff}
.nbtn:disabled{opacity:.2;cursor:default}

.left-count{
  position:relative;z-index:2;
  padding:0 22px 14px;
  font-size:10px;color:rgba(255,255,255,.28);
  font-weight:600;letter-spacing:1px;flex-shrink:0;
}

/* Dots */
.dots-bar{
  position:absolute;right:14px;top:0;bottom:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:7px;z-index:10;padding:70px 0;
}
.vdot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.22);
  cursor:pointer;transition:all .3s;flex-shrink:0;
}
.vdot.past{background:rgba(255,255,255,.5)}
.vdot.active{width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.45)}

/* ══ PAINEL DIREITO ══ */
.right{
  flex:1;position:relative;
  display:flex;flex-direction:column;
  background:#f7f8fc;overflow:hidden;
}
.right::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(26,79,138,.04) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none;
}

/* Header direito — texto legível */
.right-top{
  flex-shrink:0;
  padding:16px 30px 0;
  display:flex;align-items:flex-start;justify-content:space-between;
  position:relative;z-index:2;
}
.intro-main{
  font-size:15px;font-weight:800;color:#111827;
  letter-spacing:.1px;line-height:1.3;
}
.intro-sub{
  font-size:12px;color:#6b7280;margin-top:4px;
  max-width:480px;line-height:1.5;
}
.right-ctr{
  font-size:13px;font-weight:700;color:#d1d5db;
  font-family:'Arial Black',Arial,sans-serif;
  flex-shrink:0;margin-left:12px;margin-top:2px;
}

/* Barra de progresso */
.prog-wrap{
  flex-shrink:0;margin:10px 30px 0;
  height:2px;background:#e5e7eb;border-radius:2px;overflow:hidden;
  position:relative;z-index:2;
}
.prog-fill{height:100%;border-radius:2px;transition:width .8s ease,background .8s ease}

/* Slides */
.rslides-wrap{flex:1;position:relative;min-height:0}
.rslide{
  position:absolute;inset:0;
  padding:0 44px 0 32px;
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;
}
.rslide.active{opacity:1;pointer-events:auto}

.rslide.enter-up   .ri{animation:riEnterUp   .72s cubic-bezier(.22,1,.36,1) forwards}
.rslide.enter-down .ri{animation:riEnterDown .72s cubic-bezier(.22,1,.36,1) forwards}
.rslide.exit-up    .ri{animation:riExitUp    .45s ease forwards}
.rslide.exit-down  .ri{animation:riExitDown  .45s ease forwards}
@keyframes riEnterUp  {from{opacity:0;transform:translateY(36px)} to{opacity:1;transform:translateY(0)}}
@keyframes riEnterDown{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:translateY(0)}}
@keyframes riExitUp   {from{opacity:1;transform:translateY(0)}     to{opacity:0;transform:translateY(-30px)}}
@keyframes riExitDown {from{opacity:1;transform:translateY(0)}     to{opacity:0;transform:translateY(30px)}}
.ri{opacity:0}

.r-accent{width:36px;height:3px;border-radius:2px;margin-bottom:16px;transition:background .8s}
.r-title{
  font-size:clamp(20px,2.6vw,34px);
  font-weight:800;color:#111827;
  line-height:1.2;letter-spacing:-.3px;margin-bottom:14px;
}
.r-div{width:1px;height:24px;margin-bottom:14px;transition:background .8s}
.r-desc{
  font-size:clamp(14px,1.45vw,18px);
  color:#6b7280;line-height:1.82;max-width:520px;
}

/* Hint scroll */
.scroll-hint{
  flex-shrink:0;
  padding:8px 32px 12px;
  font-size:10px;color:#d1d5db;
  letter-spacing:1px;
  display:flex;gap:6px;align-items:center;
  position:relative;z-index:2;
}
.sk{border:1px solid #e5e7eb;border-radius:4px;padding:1px 6px;font-size:10px;color:#d1d5db}
</style>
</head>

    <div class="right-top">
      <div>
        <div class="intro-main">Nossa Jornada na Educação a Distância</div>
        <div class="intro-sub">Utilize as setas para conhecer os marcos que formam a nossa linha do tempo como Jornada de ensino a distância.</div>
      </div>
      <div class="right-ctr" id="rightCtr">01&nbsp;<span style="color:#e5e7eb;font-weight:400">/</span>&nbsp;12</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>
    <div class="rslides-wrap" id="rslides"></div>
    <div class="scroll-hint">
      <span class="sk">↑</span><span class="sk">↓</span>
      <span>ou scroll</span>
    </div>
  </div>

</div>
<script>
const EV = [
  {year:'1979',     era:'Era Pioneira', ec:'#1a4f8a',
   title:'O primeiro marco: Desenho Técnico-Mecânico',
   desc:'Lançamento do curso de Leitura e Interpretação de Desenho Técnico-Mecânico, combinando módulos impressos com salas equipadas com televisores.'},
  {year:'1990',     era:'Era Pioneira', ec:'#1a4f8a',
   title:'Expansão do modelo híbrido',
   desc:'Consolidação do catálogo e expansão do modelo baseado em materiais impressos e videoaulas.'},
  {year:'1995',     era:'Era Pioneira', ec:'#1a4f8a',
   title:'A era do Telecurso 2000',
   desc:'O SENAI-SP participa do desenvolvimento do Telecurso 2000 Profissionalizante em Mecânica, experiência marcante da Educação a Distância.'},
  {year:'2007',     era:'Era Pioneira', ec:'#1a4f8a',
   title:'Nascimento do Centro de EaD',
   desc:'Criação do grupo que daria origem ao Centro SENAI de Educação a Distância e início da transição para recursos digitais.'},
  {year:'2010',     era:'Era Digital',  ec:'#6d28d9',
   title:'Pioneirismo no ensino superior',
   desc:'O curso de Tecnologia de Produção Gráfica passa a ofertar unidades curriculares a distância, introduzindo o modelo híbrido na graduação.'},
  {year:'2010–2017',era:'Era Digital',  ec:'#6d28d9',
   title:'A virada digital e a escala',
   desc:'A cultura digital se consolida e o SENAI-SP alcança 1,5 milhão de alunos em cursos a distância ao longo de pouco mais de dez anos.'},
  {year:'2017',     era:'Era Digital',  ec:'#6d28d9',
   title:'Primeiro curso técnico semipresencial',
   desc:'A primeira oferta é implantada em Santos e rapidamente se expande para sete cursos e 19 turmas.'},
  {year:'2019',     era:'Era Digital',  ec:'#6d28d9',
   title:'Expansão para a pós-graduação',
   desc:'A especialização em Inovação e Competitividade Industrial abre caminho para novas ofertas digitais no ensino superior.'},
  {year:'2020',     era:'Era ESEO',     ec:'#059669',
   title:'Aceleração durante a pandemia',
   desc:'O SENAI-SP amplia rapidamente as soluções online e registra mais de 800 mil matrículas em diferentes tipos de cursos.'},
  {year:'2022',     era:'Era ESEO',     ec:'#059669',
   title:'Consolidação da ESEO',
   desc:'A estrutura de EaD passa a ser oficialmente nomeada Escola SENAI de Educação Online e amplia sua atuação em soluções educacionais digitais.'},
  {year:'2025',     era:'Era ESEO',     ec:'#E30613',
   title:'Novo marco regulatório',
   desc:'O Decreto nº 12.456/2025 redefine formatos, exigências presenciais, infraestrutura e critérios de qualidade no Ensino Superior.'},
  {year:'2026',     era:'Era ESEO',     ec:'#E30613',
   title:'Portal ESEO e uma nova jornada digital',
   desc:'A ESEO conecta conteúdos, serviços, orientações e soluções digitais em uma experiência mais simples para as escolas SENAI-SP e para as equipes que sustentam a Educação Online.'},
];

const N=EV.length;
let cur=0,animating=false;

/* GEO CANVAS */
const gc=document.getElementById('geoCanvas');
const gx=gc.getContext('2d');
function rsz(){gc.width=gc.offsetWidth;gc.height=gc.offsetHeight}rsz();
window.addEventListener('resize',rsz);
const gs=[];
for(let i=0;i<18;i++)gs.push({type:['tri','dia','chev','rect'][i%4],x:Math.random()*100,y:Math.random()*100,sz:14+Math.random()*44,a:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.007,dx:(Math.random()-.5)*.011,dy:(Math.random()-.5)*.009});
function dGeo(){
  gx.clearRect(0,0,gc.width,gc.height);
  gs.forEach(s=>{
    const x=s.x/100*gc.width,y=s.y/100*gc.height,z=s.sz;
    gx.save();gx.translate(x,y);gx.rotate(s.a);
    gx.strokeStyle='#fff';gx.lineWidth=1.2;gx.globalAlpha=1;
    if(s.type==='tri'){gx.beginPath();gx.moveTo(0,-z);gx.lineTo(z*.87,z*.5);gx.lineTo(-z*.87,z*.5);gx.closePath();gx.stroke();}
    else if(s.type==='dia'){gx.beginPath();gx.moveTo(0,-z);gx.lineTo(z*.6,0);gx.lineTo(0,z);gx.lineTo(-z*.6,0);gx.closePath();gx.stroke();}
    else if(s.type==='chev'){gx.beginPath();gx.moveTo(-z*.5,-z*.35);gx.lineTo(0,z*.35);gx.lineTo(z*.5,-z*.35);gx.lineWidth=1.8;gx.stroke();}
    else{gx.strokeRect(-z*.4,-z*.28,z*.8,z*.56);}
    gx.restore();
    s.x+=s.dx;s.y+=s.dy;s.a+=s.rs;
    if(s.x<-5)s.x=105;if(s.x>105)s.x=-5;
    if(s.y<-5)s.y=105;if(s.y>105)s.y=-5;
  });
  requestAnimationFrame(dGeo);
}
dGeo();

/* BUILD SLIDES */
const rsEl=document.getElementById('rslides');
EV.forEach((ev,i)=>{
  const sl=document.createElement('div');
  sl.className='rslide'+(i===0?' active':'');
  sl.dataset.i=i;
  sl.innerHTML='<div class="ri">'
    +'<div class="r-accent" style="background:'+ev.ec+'"></div>'
    +'<div class="r-title">'+ev.title+'</div>'
    +'<div class="r-div" style="background:linear-gradient(180deg,'+ev.ec+',transparent)"></div>'
    +'<div class="r-desc">'+ev.desc+'</div>'
    +'</div>';
  rsEl.appendChild(sl);
});
document.querySelector('.rslide.active .ri').style.animation='riEnterUp .72s cubic-bezier(.22,1,.36,1) forwards';

/* DOTS */
const dotsBar=document.getElementById('dotsBar');
EV.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='vdot'+(i===0?' active':'');
  d.addEventListener('click',()=>goTo(i));
  dotsBar.appendChild(d);
});
const dotEls=[...dotsBar.children];

/* NAVIGATE */
function goTo(next){
  if(animating||next===cur||next<0||next>=N)return;
  animating=true;
  const going=next>cur;
  const yearEl=document.getElementById('leftYear');
  yearEl.classList.remove('visible');
  const pR=document.querySelector('.rslide.active');
  const pRi=pR.querySelector('.ri');
  pRi.style.animation='none';void pRi.offsetWidth;
  pRi.style.animation=going?'riExitUp .42s ease forwards':'riExitDown .42s ease forwards';
  setTimeout(()=>{
    pR.classList.remove('active');
    cur=next;
    const ev=EV[cur];
    document.getElementById('leftPanel').style.background=ev.ec;
    document.getElementById('leftEra').textContent=ev.era;
    document.getElementById('yearTxt').textContent=ev.year;
    document.getElementById('leftCount').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
    document.getElementById('rightCtr').innerHTML=String(cur+1).padStart(2,'0')+'&nbsp;<span style="color:#e5e7eb;font-weight:400">/</span>&nbsp;'+String(N).padStart(2,'0');
    const pct=N<=1?100:(cur/(N-1))*100;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('progFill').style.background=ev.ec;
    document.getElementById('btnP').disabled=cur===0;
    document.getElementById('btnN').disabled=cur===N-1;
    dotEls.forEach((d,i)=>{d.classList.toggle('active',i===cur);d.classList.toggle('past',i<cur);});
    const nR=document.querySelector('.rslide[data-i="'+cur+'"]');
    const nRi=nR.querySelector('.ri');
    nR.classList.add('active');
    nRi.style.animation='none';void nRi.offsetWidth;
    nRi.style.animation=going?'riEnterUp .72s cubic-bezier(.22,1,.36,1) forwards':'riEnterDown .72s cubic-bezier(.22,1,.36,1) forwards';
    setTimeout(()=>yearEl.classList.add('visible'),60);
    setTimeout(()=>animating=false,750);
  },400);
}

/* INIT */
setTimeout(()=>document.getElementById('leftYear').classList.add('visible'),200);
document.getElementById('btnP').disabled=true;

/* EVENTS */
document.getElementById('btnP').addEventListener('click',()=>goTo(cur-1));
document.getElementById('btnN').addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();goTo(cur-1)}
  if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();goTo(cur+1)}
  if(e.key==='Home'){e.preventDefault();goTo(0)}
  if(e.key==='End'){e.preventDefault();goTo(N-1)}
});
let st,ty=0;
window.addEventListener('wheel',e=>{clearTimeout(st);st=setTimeout(()=>{if(e.deltaY>25)goTo(cur+1);else if(e.deltaY<-25)goTo(cur-1);},30);},{passive:true});
document.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dy=ty-e.changedTouches[0].clientY;if(Math.abs(dy)>50){if(dy>0)goTo(cur+1);else goTo(cur-1);}},{passive:true});
</script>
</body>
</html>
