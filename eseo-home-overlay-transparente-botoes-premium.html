}

  content:"";
  position:absolute;
  inset:auto 0 0;
  height:31%;
  z-index:-2;

  pointer-events:none;

.hero{
  background-image:none!important;
  background-size:cover!important;
  background-position:center center!important;
  background-repeat:no-repeat!important;
}
.shell{
  width:min(1296px,calc(100% - 64px));
  height:100%;
  margin:0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:74px;
  flex:0 0 74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  position:relative;
  z-index:20;
}
.nav{
  display:flex;
  align-items:center;
  gap:48px;
  min-width:0;
}
.nav a{
  position:relative;
  color:#fff;
  text-decoration:none;
  text-transform:uppercase;
  font-size:clamp(16px,1.1vw,19px);
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.38);
  padding:11px 0;
  transition:color .18s ease,transform .18s ease;
}
.nav a::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:2px;
  height:3px;
  border-radius:99px;
  background:#fff;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform .18s ease;
}
.nav a:hover,
.nav a:focus-visible{color:#fff;transform:translateY(-1px)}
.nav a:hover::after,
.nav a:focus-visible::after{transform:scaleX(1)}
.nav a[aria-current="page"]{color:var(--cyan);transform:none}
.search-wrap{
  position:relative;
  display:flex;
  justify-content:flex-end;
}
.search{
  height:48px;
  width:48px;
  border:2px solid #082b40;
  border-radius:999px;
  background:#fff;
  box-shadow:0 6px 22px rgba(0,0,0,.14);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  overflow:hidden;
  transition:width .28s ease;
}
.search.is-open{width:min(430px,38vw)}
.search input{
  width:0;
  opacity:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
  color:#0a2537;
  padding:0;
  transition:all .18s ease;
}
.search.is-open input{
  width:100%;
  opacity:1;
  padding:0 8px 0 18px;
}
.search button{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  border:0;
  background:#fff;
  cursor:pointer;
}
.search svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:#082b40;
  stroke-width:2.2;
}
.suggestions{
  display:none;
  position:absolute;
  top:57px;
  right:0;
  width:min(430px,80vw);
  max-height:330px;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  box-shadow:0 18px 46px rgba(0,0,0,.25);
  padding:8px;
  color:#0a2537;
}
.suggestions.show{display:block}
.suggestion{
  display:grid;
  grid-template-columns:36px 1fr;
  gap:10px;
  align-items:center;
  padding:10px 11px;
  border-radius:10px;
  color:#0a2537;
  text-decoration:none;
}
.suggestion:hover{background:#eef7fa}
.suggestion-icon{
  width:32px;height:32px;border-radius:9px;
  background:#e9f8fb;color:#0b7182;
  display:grid;place-items:center;
  font-size:12px;font-weight:900;
}
.suggestion strong{display:block;font-size:13px}
.suggestion small{display:block;margin-top:2px;color:#60737d;font-size:11px}

.content{
  position:absolute;
  top:160px;
  left:0;
  display:flex;
  flex-direction:column;
  padding:0;
  max-width:none;
}
.eyebrow{
  margin:0 0 18px;
  color:#fff;
  font-size:16px;
  line-height:1;
  font-weight:900;
  letter-spacing:.29em;
  text-transform:uppercase;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
h1{
  margin:0;
  color:#fff;
  font-size:clamp(62px,6vw,100px);
  line-height:.95;
  letter-spacing:-.045em;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 7px 30px rgba(0,0,0,.18);
}
.redline{
  width:96px;
  height:6px;
  border-radius:99px;
  background:var(--red);
  margin:29px 0 24px;
}
.tagline{
  margin:0;
  max-width:none;
  font-size:clamp(18px,1.45vw,23px);
  line-height:1.38;
  font-weight:400;
  color:rgba(255,255,255,.96);
  text-shadow:0 2px 14px rgba(0,0,0,.22);
  white-space:nowrap;
}
.quick-actions{
  position:absolute;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(4,minmax(160px,1fr));
  gap:10px;
  width:100%;
  z-index:10;
}
.shortcut{
  position:relative;
  min-height:62px;
  border:1px solid var(--line);
  border-radius:10px;
  background:linear-gradient(135deg,rgba(3,41,55,.86),rgba(9,77,96,.78));
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  box-shadow:0 9px 24px rgba(0,0,0,.12);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.shortcut:hover{
  transform:translateY(-3px);
  border-color:rgba(102,230,242,.9);
  background:linear-gradient(135deg,rgba(3,41,55,.95),rgba(8,93,112,.9));
}
.shortcut svg{
  width:28px;
  height:28px;
  flex:0 0 28px;
  fill:none;
  stroke:#66e6f2;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.shortcut strong{
  font-size:clamp(14px,1vw,16px);
  line-height:1.15;
  text-transform:uppercase;
  font-weight:900;
}
:focus-visible{
  outline:3px solid #66e6f2;
  outline-offset:3px;
}

@media (max-width:1050px){
  .shell{width:min(1296px,calc(100% - 38px))}
  .nav{gap:24px}
  .photo{width:67%;opacity:.9}
  .content{top:150px;left:0;max-width:none}
  .quick-actions{
    left:50%;
    width:100%;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .hero{height:640px;min-height:640px;max-height:640px}
}
@media (max-width:720px){
  .hero{height:auto;min-height:760px;max-height:none}
  .photo{
    width:100%;
    height:54%;
    top:0;
    opacity:.52;
    background-position:68% center;
  }
  .photo::before{
    background:linear-gradient(180deg,rgba(7,30,44,.25),#071e2c 92%);
  }
  .shell{width:calc(100% - 28px)}
  .topbar{height:auto;min-height:74px;padding:10px 0;align-items:flex-start}
  .nav{
    gap:15px;
    flex-wrap:wrap;
    padding-top:5px;
    padding-right:56px;
  }
  .nav a{font-size:13px}
  .search-wrap{position:absolute;right:0;top:7px}
  .search.is-open{width:min(300px,78vw)}
  .content{
    position:relative;
    top:auto;
    left:auto;
    min-height:520px;
    justify-content:flex-end;
    padding:110px 5px 180px;
    max-width:none;
  }
  .eyebrow{font-size:12px;letter-spacing:.22em}
  h1{white-space:normal;font-size:clamp(48px,13vw,72px)}
  .tagline{font-size:17px;max-width:510px;white-space:normal}
  .redline{width:72px;height:5px;margin:22px 0 18px}
  .quick-actions{
    position:absolute;
    left:5px;
    right:5px;
    bottom:22px;
    transform:none;
    width:auto;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .shortcut{min-height:64px;padding:9px 11px}
  .shortcut strong{font-size:13px}
}


/* Ajustes pontuais solicitados: tip dos atalhos e legibilidade, sem alterar a composição. */
.shortcut strong{
  font-size:clamp(14px,1vw,16px);
}
.shortcut::after{
  content:attr(data-tip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 9px);
  width:250px;
  transform:translate(-50%,8px);
  padding:10px 12px;
  border-radius:9px;
  background:rgba(4,28,39,.96);
  color:#fff;
  font-size:13.5px;
  line-height:1.38;
  font-weight:500;
  box-shadow:0 12px 28px rgba(0,0,0,.25);
  pointer-events:none;
  opacity:0;
  transition:.18s ease;
  z-index:30;
}
.shortcut:hover::after,
.shortcut:focus-visible::after{
  opacity:1;
  transform:translate(-50%,0);
}
@media (max-width:720px){
  .shortcut strong{font-size:14px}
}

<script>
(() => {
  const PORTAL = "https://sesisenaisp.sharepoint.com/sites/ESEOConecta";
  const HOME = PORTAL + "/SitePages/OrganizationHome.aspx";
  const GITHUB_PAGES = "https://marciosqueiroz.github.io/portal-eseo-webparts";
  const INDEX_URL = "./eseo-search-index.json";

  const form = document.getElementById("searchForm");
  const input = document.getElementById("searchInput");
  const suggestions = document.getElementById("suggestions");
  let items = [];

  /* O mesmo HTML atende às três páginas. Apenas o destaque do menu muda. */
  const pageParam = normalize(new URLSearchParams(location.search).get("ativa") ||
                              new URLSearchParams(location.search).get("pagina") ||
                              "home");
  const activePage = ["home","conheca","oferta"].includes(pageParam) ? pageParam : "home";
  document.querySelectorAll(".nav a[data-page]").forEach(link => {
    if(link.dataset.page === activePage) link.setAttribute("aria-current","page");
    else link.removeAttribute("aria-current");
  });

  const fallback = [
    {title:"Home do Portal ESEO",subtitle:"Página inicial",icon:"H",url:HOME,keywords:["home","inicio","portal","eseo"]},
    {title:"Conheça a ESEO",subtitle:"História, identidade, proposta e estrutura",icon:"E",url:PORTAL + "/SitePages/Sobre-a-ESEO.aspx",keywords:["historia","identidade","proposta","estrutura"]},
    {title:"Oferta de cursos online",subtitle:"Página central de cursos e orientações",icon:"O",url:PORTAL + "/SitePages/What's-happening.aspx",keywords:["oferta","curso","cursos","catalogo","portfolio","bussola"]},
    {title:"Portfólio de cursos",subtitle:"Consulte cursos, códigos, formatos e materiais",icon:"P",url:GITHUB_PAGES + "/eseo-catalogo-cursos.html",keywords:["portfolio","catalogo","curso","cursos","codigo","sgset"]},
    {title:"Bússola EAD",subtitle:"Encontre a oferta indicada para cada necessidade",icon:"B",url:GITHUB_PAGES + "/bussola-ead.html",keywords:["bussola","orientacao","curso","oferta","modalidade","estrategia"]},
    {title:"Proposta Pedagógica da ESEO",subtitle:"Documento institucional em versão interativa",icon:"P",url:GITHUB_PAGES + "/proposta-pedagogica-eseo-interativa.html",keywords:["proposta","proposta pedagogica","documento institucional","metodologia","diretrizes"]},
    {title:"Cronograma dos processos seletivos",subtitle:"Consulte as datas dos processos seletivos do SENAI-SP",icon:"C",url:"https://sesisenaisp.sharepoint.com/sites/intranet/Atos%20Formais/CO-GED-56-2026.pdf",keywords:["cronograma","processo seletivo","processos seletivos","datas","senai-sp"]},
    {title:"Liberar turma no SGSET",subtitle:"Solicitação de liberação de turma",icon:"L",url:"https://forms.office.com/pages/responsepage.aspx?id=3qZIQdENBE2kxXjjdOT21kx71JN6hW5Mh8ztNWPFnzFUQUVTNDNQNEhDVkFRODFPUkdJWTlPSzNZMS4u",keywords:["liberar","turma","sgset","forms"]},
    {title:"Soluções EAD",subtitle:"Novos cursos e ofertas personalizadas",icon:"S",url:"mailto:eadempresas@sp.senai.br?subject=Solu%C3%A7%C3%B5es%20EAD%20-%20Portal%20ESEO",keywords:["solucoes","ead","personalizado","personalizacao","novo curso","empresa"]},
    {title:"Parceria AQV e ESEO",subtitle:"Solicite uma ação conjunta para sua unidade",icon:"A",url:"mailto:rantonio@sp.senai.br?subject=Parceria%20AQV%20e%20ESEO",keywords:["parceria","aqv","eseo","acao","unidade"]}
  ];

  function normalize(v){
    return String(v || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .trim();
  }

  function isInternalPortalUrl(url){
    try{
      const target = new URL(url, location.href);
      return target.hostname === "sesisenaisp.sharepoint.com" &&
             target.pathname.toLowerCase().startsWith("/sites/eseoconecta");
    }catch(_){
      return false;
    }
  }

  async function loadIndex(){
    try{
      const r = await fetch(INDEX_URL + "?v=" + Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error("índice indisponível");
      const data = await r.json();
      const indexed = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);

      /* Os atalhos atuais vêm primeiro. Assim, um índice antigo nunca recupera
         um endereço descontinuado para Home, Portfólio, Bússola ou contatos. */
      const seen = new Set();
      items = [...fallback, ...indexed].filter(item => {
        const key = normalize(item.title);
        if(!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }catch(_){
      items = fallback;
    }
  }

  function escapeHtml(v){
    return String(v || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function render(q){
    const term = normalize(q);
    if(!term){
      suggestions.classList.remove("show");
      suggestions.innerHTML = "";
      return;
    }

    const result = items
      .filter(item => {
        const kws = Array.isArray(item.keywords) ? item.keywords : [item.keywords || ""];
        const bag = normalize([item.title,item.subtitle,...kws].join(" "));
        return bag.includes(term);
      })
      .slice(0,6);

    if(!result.length){
      const searchUrl = PORTAL + "/_layouts/15/search.aspx/siteall?q=" + encodeURIComponent(q);
      suggestions.innerHTML =
        '<a class="suggestion" href="' + searchUrl + '" target="_top">' +
        '<span class="suggestion-icon">↗</span><span><strong>Pesquisar no Portal ESEO</strong>' +
        '<small>Ver todos os resultados para “' + escapeHtml(q) + '”</small></span></a>';
      suggestions.classList.add("show");
      return;
    }

    suggestions.innerHTML = result.map(item => `
      <a class="suggestion" href="${escapeHtml(item.url)}" target="_top">
        <span class="suggestion-icon">${escapeHtml(item.icon || "•")}</span>
        <span>
          <strong>${escapeHtml(item.title || "")}</strong>
          <small>${escapeHtml(item.subtitle || "")}</small>
        </span>
      </a>
    `).join("");

    suggestions.classList.add("show");
  }

  form.addEventListener("click", () => form.classList.add("is-open"));
  input.addEventListener("input", e => render(e.target.value));

  form.addEventListener("submit", e => {
    e.preventDefault();

    if(!form.classList.contains("is-open")){
      form.classList.add("is-open");
      input.focus();
      return;
    }

    const term = input.value.trim();
    if(!term){
      input.focus();
      return;
    }

    window.open(PORTAL + "/_layouts/15/search.aspx/siteall?q=" + encodeURIComponent(term), "_top");
  });

  document.addEventListener("click", e => {
    if(!e.target.closest("#searchWrap")){
      suggestions.classList.remove("show");
      if(!input.value.trim()) form.classList.remove("is-open");
    }
  });

  loadIndex();
})();
</script>

<script>
/* Navegação segura quando este HTML está incorporado em um iframe do SharePoint. */
(() => {
  function openSharePointSafeLink(url,target='_top'){
    let resolved='';
    try{ resolved=new URL(url,window.location.href).href; }
    catch(_){ resolved=String(url||''); }
    if(!resolved) return;

    const bridge=document.createElement('a');
    bridge.href=resolved;
    bridge.target=target||'_self';
    bridge.rel='noopener noreferrer';
    bridge.dataset.eseoBridge='1';
    bridge.style.position='fixed';
    bridge.style.left='-9999px';
    bridge.style.top='-9999px';
    bridge.textContent='Abrir';
    document.body.appendChild(bridge);
    bridge.click();
    setTimeout(()=>bridge.remove(),1000);
  }

  document.addEventListener('click',event=>{
    const link=event.target.closest?.('a[href]');
    if(!link || link.dataset.eseoBridge==='1' || link.hasAttribute('download')) return;
    if(event.button!==0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const href=link.getAttribute('href')||'';
    if(!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('data:')) return;
    if(href.startsWith('mailto:') || href.startsWith('tel:')) return;
    event.preventDefault();
    openSharePointSafeLink(href,link.getAttribute('target')||'_self');
  },true);
})();
</script>
