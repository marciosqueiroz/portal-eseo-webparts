<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxigênio ESEO</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff 0%, #eaf5fb 55%, #cde9f5 100%);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      position: relative;
    }

    /* ── WAVE: desenhada via canvas no JS, sem corte ── */
    #waveCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 38%;
      pointer-events: none;
      z-index: 1;
    }

    /* ── PARTÍCULAS MOLECULARES ── */
    #particleCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.45;
      z-index: 2;
    }

    /* ── TEXTO ── */
    .content {
      position: absolute;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
    }
    .content h1 {
      font-size: clamp(28px, 4.5vw, 72px);
      font-weight: 900;
      color: #0a2537;
      line-height: 1;
      letter-spacing: -1px;
    }
    .content h1 span { color: #e30613; }
    .content h2 {
      font-size: clamp(18px, 2.8vw, 46px);
      font-weight: 700;
      color: #e30613;
      margin-top: 0.15em;
      line-height: 1;
    }
    .content p {
      font-size: clamp(14px, 1.5vw, 24px);
      font-weight: 600;
      color: #3a5a6e;
      margin-top: 0.6em;
      letter-spacing: 0.2px;
    }
    .divider {
      width: 0px;
      height: 4px;
      background: #e30613;
      border-radius: 2px;
      margin-top: 0.8em;
      animation: expandLine 1.8s ease forwards 0.3s;
    }
    @keyframes expandLine {
      from { width: 0; } to { width: 70px; }
    }

    /* ── O2 SÍMBOLO ── */
    .o2-wrap {
      position: absolute;
      right: 7%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      animation: floatSymbol 5s ease-in-out infinite;
    }
    @keyframes floatSymbol {
      0%, 100% {
        transform: translateY(-50%) scale(1);
        filter: drop-shadow(0 0 20px rgba(227,6,19,0.4)) drop-shadow(0 0 40px rgba(30,120,220,0.2));
      }
      50% {
        transform: translateY(calc(-50% - 14px)) scale(1.04);
        filter: drop-shadow(0 0 40px rgba(227,6,19,0.6)) drop-shadow(0 0 70px rgba(30,120,220,0.35));
      }
    }
    .o2-text {
      font-size: clamp(70px, 12vw, 180px);
      font-weight: 900;
      /* Gradiente: azul claro vibrante → vermelho */
      background: linear-gradient(145deg, #1a7fd4 10%, #e30613 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      position: relative;
      user-select: none;
    }
    .o2-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 115%;
      height: 115%;
      border-radius: 50%;
      border: 2px solid rgba(26, 127, 212, 0.18);
      animation: ringPulse 3s ease-in-out infinite;
    }
    .o2-ring2 {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140%;
      height: 140%;
      border-radius: 50%;
      border: 1px solid rgba(227, 6, 19, 0.1);
      animation: ringPulse 3s ease-in-out infinite 1.2s;
    }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0;   transform: translate(-50%, -50%) scale(1.35); }
    }

    /* ── BOLHAS ── */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(100,190,230,0.12));
      border: 1px solid rgba(100, 180, 230, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: rgba(26, 90, 150, 0.5);
      animation: riseBubble linear forwards;
      backdrop-filter: blur(2px);
      z-index: 10;
    }
    @keyframes riseBubble {
      0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
      8%   { opacity: 1; }
      85%  { opacity: 0.65; }
      100% { transform: translateY(var(--rise)) translateX(var(--drift)) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Wave canvas (sem corte) -->
  <canvas id="waveCanvas"></canvas>

  <!-- Partículas moleculares -->
  <canvas id="particleCanvas"></canvas>

  <!-- Texto principal -->
  <div class="content">
    <h1>Oxigênio <span>ESEO</span></h1>
    <h2>Hub de Ideias</h2>
    <p>com foco em Experiência e Fidelização de Clientes</p>
    <div class="divider"></div>
  </div>

  <!-- Símbolo O2 -->
  <div class="o2-wrap">
    <div style="position:relative; display:inline-block;">
      <div class="o2-ring"></div>
      <div class="o2-ring2"></div>
      <div class="o2-text">O₂</div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════
       1. WAVE ANIMADA VIA CANVAS
    ════════════════════════════════ */
    const waveCanvas = document.getElementById('waveCanvas');
    const wctx = waveCanvas.getContext('2d');
    let wt = 0;

    function resizeWave() {
      waveCanvas.width  = window.innerWidth;
      waveCanvas.height = waveCanvas.offsetHeight;
    }
    resizeWave();
    window.addEventListener('resize', resizeWave);

    function drawWave() {
      const W = waveCanvas.width;
      const H = waveCanvas.height;
      wctx.clearRect(0, 0, W, H);

      // Onda 1 — azul suave
      wctx.beginPath();
      wctx.moveTo(0, H);
      for (let x = 0; x <= W; x++) {
        const y = H * 0.45 + Math.sin((x / W) * 2.5 * Math.PI + wt) * H * 0.22
                            + Math.sin((x / W) * 4   * Math.PI + wt * 1.3) * H * 0.08;
        wctx.lineTo(x, y);
      }
      wctx.lineTo(W, H);
      wctx.closePath();
      wctx.fillStyle = 'rgba(96, 184, 224, 0.32)';
      wctx.fill();

      // Onda 2 — azul mais claro, levemente atrasada
      wctx.beginPath();
      wctx.moveTo(0, H);
      for (let x = 0; x <= W; x++) {
        const y = H * 0.58 + Math.sin((x / W) * 3 * Math.PI + wt * 0.8 + 1) * H * 0.18
                            + Math.sin((x / W) * 5 * Math.PI + wt * 1.1) * H * 0.06;
        wctx.lineTo(x, y);
      }
      wctx.lineTo(W, H);
      wctx.closePath();
      wctx.fillStyle = 'rgba(180, 220, 240, 0.28)';
      wctx.fill();

      // Onda 3 — traço vermelho sutil
      wctx.beginPath();
      wctx.moveTo(0, H);
      for (let x = 0; x <= W; x++) {
        const y = H * 0.68 + Math.sin((x / W) * 2 * Math.PI + wt * 0.6 + 2) * H * 0.12;
        wctx.lineTo(x, y);
      }
      wctx.lineTo(W, H);
      wctx.closePath();
      wctx.fillStyle = 'rgba(227, 6, 19, 0.05)';
      wctx.fill();

      wt += 0.012;
      requestAnimationFrame(drawWave);
    }
    drawWave();

    /* ════════════════════════════════
       2. PARTÍCULAS MOLECULARES
    ════════════════════════════════ */
    const pCanvas = document.getElementById('particleCanvas');
    const pctx = pCanvas.getContext('2d');

    function resizeP() {
      pCanvas.width  = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    resizeP();
    window.addEventListener('resize', resizeP);

    const particles = Array.from({ length: 42 }, () => ({
      x:  Math.random() * window.innerWidth,
      y:  Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r:  Math.random() * 2.8 + 1.2,
    }));

    function drawParticles() {
      pctx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            pctx.beginPath();
            pctx.strokeStyle = `rgba(26, 100, 190, ${0.2 * (1 - dist / 130)})`;
            pctx.lineWidth = 0.7;
            pctx.moveTo(particles[i].x, particles[i].y);
            pctx.lineTo(particles[j].x, particles[j].y);
            pctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        pctx.beginPath();
        pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pctx.fillStyle = 'rgba(26, 110, 200, 0.4)';
        pctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > pCanvas.width)  p.vx *= -1;
        if (p.y < 0 || p.y > pCanvas.height) p.vy *= -1;
      });

      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    /* ════════════════════════════════
       3. BOLHAS FLUTUANTES
    ════════════════════════════════ */
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      const size  = Math.random() * 55 + 16;
      const left  = Math.random() * 94;
      const dur   = Math.random() * 9 + 7;
      const delay = Math.random() * 2;
      const drift = ((Math.random() - 0.5) * 160) + 'px';
      const rise  = '-' + (window.innerHeight + size + 50) + 'px';
      const fs    = size * 0.27;

      bubble.style.cssText = `
        width:${size}px; height:${size}px;
        left:${left}%;
        bottom:-${size + 10}px;
        font-size:${fs}px;
        --drift:${drift};
        --rise:${rise};
        animation-duration:${dur}s;
        animation-delay:${delay}s;
      `;

      if (size > 34) bubble.textContent = 'O₂';
      document.body.appendChild(bubble);
      setTimeout(() => bubble.remove(), (dur + delay + 0.8) * 1000);
    }

    for (let i = 0; i < 20; i++) setTimeout(createBubble, i * 320);
    setInterval(createBubble, 720);
  </script>
</body>
</html>
