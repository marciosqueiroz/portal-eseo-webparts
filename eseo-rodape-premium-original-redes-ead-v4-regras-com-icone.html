<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodapé — Portal ESEO</title>

  <style>
    :root {
      --navy: #000000;
      --navy-light: #000000;
      --cyan: #63E5F2;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 190px;
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .footer {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 190px;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(420px, auto);
      align-items: center;
      gap: clamp(28px, 5vw, 76px);
      padding: 34px clamp(26px, 8vw, 150px);
      overflow: hidden;
      background: #000000;
    }

    .footer::before {
      position: absolute;
      z-index: -1;
      top: 0;
      right: 0;
      left: 0;
      height: 2px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--cyan) 24%, rgba(99, 229, 242, .3) 76%, transparent);
    }

    .contact { min-width: 0; }

    .contact__title {
      margin: 0 0 10px;
      color: var(--white);
      font-size: clamp(17px, 1.35vw, 20px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: .025em;
    }

    .contact__line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin: 0;
      color: rgba(255, 255, 255, .84);
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.45;
    }

    .contact__phone {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: inherit;
      text-decoration: none;
    }

    .contact__phone:hover,
    .contact__phone:focus-visible {
      color: var(--cyan);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .contact__phone:focus-visible {
      border-radius: 3px;
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .contact__phone svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .contact__separator { color: rgba(255, 255, 255, .38); }

    .social {
      display: grid;
      grid-template-columns: repeat(5, minmax(68px, 1fr));
      align-items: stretch;
      justify-self: end;
      gap: clamp(6px, .8vw, 12px);
    }

    .social__link {
      position: relative;
      min-width: 68px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
      padding: 12px 8px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      color: rgba(255, 255, 255, .9);
      text-decoration: none;
      transition:
        background 240ms ease,
        border-color 240ms ease,
        color 240ms ease,
        box-shadow 240ms ease,
        transform 260ms cubic-bezier(.2, .8, .2, 1);
    }

    .social__link:hover,
    .social__link:focus-visible {
      border-color: rgba(99, 229, 242, .48);
      background: rgba(99, 229, 242, .1);
      color: var(--white);
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .22), 0 0 22px rgba(99, 229, 242, .1);
    }

    .social__link:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .social__link:hover .social__icon img,
      .social__link:hover .social__brand-icon {
        transform: scale(1.07) rotate(-2deg);
      }
    }

    .social__icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
    }

    .social__icon img {
      width: 58px;
      height: 58px;
      display: block;
      object-fit: contain;
      filter: grayscale(1) brightness(0) invert(1);
      transition: filter 260ms ease, transform 260ms cubic-bezier(.2, .8, .2, 1);
    }

    .social__link:hover .social__icon img,
    .social__link:focus-visible .social__icon img {
      filter: none;
      transform: scale(1.07);
    }

    .social__brand-icon {
      width: 58px;
      height: 58px;
      display: block;
      overflow: visible;
      transition: transform 260ms cubic-bezier(.2, .8, .2, 1);
    }

    .social__brand-icon .brand-default,
    .social__brand-icon .brand-color {
      transition: opacity 260ms ease;
    }

    .social__brand-icon .brand-default { filter: invert(1); }
    .social__brand-icon .brand-default { opacity: 1; }
    .social__brand-icon .brand-color { opacity: 0; }

    .social__link:hover .social__brand-icon,
    .social__link:focus-visible .social__brand-icon {
      transform: scale(1.07);
    }

    .social__link:hover .social__brand-icon .brand-default,
    .social__link:focus-visible .social__brand-icon .brand-default {
      opacity: 0;
    }

    .social__link:hover .social__brand-icon .brand-color,
    .social__link:focus-visible .social__brand-icon .brand-color {
      opacity: 1;
    }

    .social__fallback {
      width: 58px;
      height: 58px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social__fallback[hidden] { display: none; }

    .social__label {
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
    }

    .access-notice {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, .62);
      font-size: 11px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .access-tracker-status:not([hidden]) {
      display: block;
      margin-top: 6px;
      color: #FFD0D0;
      font-weight: 600;
    }

    @media (max-width: 860px) {
      .footer {
        grid-template-columns: 1fr;
        gap: 24px;
        padding-block: 30px;
      }
      .social {
        justify-self: stretch;
        width: 100%;
        grid-template-columns: repeat(5, minmax(60px, 1fr));
      }
    }

    @media (max-width: 500px) {
      .footer {
        padding-inline: 20px;
        gap: 22px;
      }
      .social {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .contact__separator { display: none; }
      .contact__line { align-items: flex-start; flex-direction: column; }
      .access-notice { white-space: normal; }
      .social__link {
        min-width: 0;
        padding: 10px 4px;
      }
      .social__icon,
      .social__icon img,
      .social__brand-icon { width: 48px; height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
      .social__icon img,
      .social__brand-icon,
      .social__brand-icon .brand-default,
      .social__brand-icon .brand-color { transition: none; }
    }
  </style>
</head>
